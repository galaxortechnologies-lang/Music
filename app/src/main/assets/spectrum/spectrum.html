<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .grid-line {
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 1;
      stroke-dasharray: 2,3;
    }
    .freq-label {
      fill: rgba(255, 255, 255, 0.56);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }
  </style>
</head>
<body>
  <svg id="spectrum-svg" aria-label="DSP Frequency Spectrum"></svg>
  <!-- D3_INLINE_PLACEHOLDER -->
  <script>
    (function () {
      const svg = d3.select("#spectrum-svg");
      const defs = svg.append("defs");
      const grad = defs.append("linearGradient")
        .attr("id", "nigutuSpectrumGrad")
        .attr("x1", "0%").attr("y1", "100%")
        .attr("x2", "0%").attr("y2", "0%");

      const stopLow = grad.append("stop").attr("offset", "0%").attr("stop-color", "#7C4DFF").attr("stop-opacity", 0.55);
      const stopMid = grad.append("stop").attr("offset", "55%").attr("stop-color", "#40C4FF").attr("stop-opacity", 0.88);
      const stopHigh = grad.append("stop").attr("offset", "100%").attr("stop-color", "#80D8FF").attr("stop-opacity", 1.0);

      const gridGroup = svg.append("g");
      const barsGroup = svg.append("g");
      const peaksGroup = svg.append("g");
      const labelsGroup = svg.append("g");

      const freqLabels = [
        { label: "32Hz", ratio: 0.02 },
        { label: "125Hz", ratio: 0.25 },
        { label: "500Hz", ratio: 0.50 },
        { label: "2kHz", ratio: 0.74 },
        { label: "8kHz", ratio: 0.94 }
      ];

      let lastFrame = {
        bands: new Array(32).fill(0),
        peaks: new Array(32).fill(0),
        bassEnergy: 0,
        midEnergy: 0,
        highEnergy: 0,
        isActive: false
      };
      let accentHex = "#40C4FF";

      function applyAccent(hex) {
        if (!hex || typeof hex !== "string") return;
        accentHex = hex;
        stopLow.attr("stop-color", hex).attr("stop-opacity", 0.35);
        stopMid.attr("stop-color", hex).attr("stop-opacity", 0.82);
        stopHigh.attr("stop-color", "#FFFFFF").attr("stop-opacity", 0.96);
      }

      function render(frame) {
        const w = Math.max(120, window.innerWidth || 320);
        const h = Math.max(64, window.innerHeight || 120);
        const padX = 8;
        const padTop = 8;
        const padBottom = 18;
        const chartW = w - padX * 2;
        const chartH = Math.max(24, h - padTop - padBottom);

        svg.attr("viewBox", "0 0 " + w + " " + h);

        const bands = frame.bands || [];
        const peaks = frame.peaks || [];
        const indices = d3.range(bands.length);

        const x = d3.scaleBand()
          .domain(indices)
          .range([padX, padX + chartW])
          .paddingInner(0.28)
          .paddingOuter(0.08);

        const y = d3.scaleLinear()
          .domain([0, 1])
          .range([padTop + chartH, padTop]);

        const gridLevels = [0.25, 0.5, 0.75];
        const lines = gridGroup.selectAll("line.grid-line").data(gridLevels);
        lines.enter()
          .append("line")
          .attr("class", "grid-line")
          .merge(lines)
          .attr("x1", padX)
          .attr("x2", padX + chartW)
          .attr("y1", d => y(d))
          .attr("y2", d => y(d));
        lines.exit().remove();

        const barW = Math.max(2, x.bandwidth());
        const bars = barsGroup.selectAll("rect.bar").data(bands);
        bars.enter()
          .append("rect")
          .attr("class", "bar")
          .attr("rx", Math.min(3, barW / 2))
          .attr("ry", Math.min(3, barW / 2))
          .attr("fill", "url(#nigutuSpectrumGrad)")
          .merge(bars)
          .attr("x", (_, i) => x(i))
          .attr("width", barW)
          .attr("y", d => {
            const clamped = Math.max(0.03, Math.min(1, d || 0));
            return y(clamped);
          })
          .attr("height", d => {
            const clamped = Math.max(0.03, Math.min(1, d || 0));
            return Math.max(2, (padTop + chartH) - y(clamped));
          })
          .attr("opacity", d => (d > 0.01 ? 0.95 : 0.28));
        bars.exit().remove();

        const peakCaps = peaksGroup.selectAll("rect.peak").data(peaks);
        peakCaps.enter()
          .append("rect")
          .attr("class", "peak")
          .attr("rx", 1)
          .attr("fill", "#FFFFFF")
          .merge(peakCaps)
          .attr("x", (_, i) => x(i))
          .attr("width", barW)
          .attr("height", 2)
          .attr("y", d => y(Math.max(0.04, Math.min(1, d || 0))) - 3)
          .attr("opacity", d => (d > 0.05 ? 0.85 : 0.0));
        peakCaps.exit().remove();

        const labels = labelsGroup.selectAll("text.freq-label").data(freqLabels);
        labels.enter()
          .append("text")
          .attr("class", "freq-label")
          .merge(labels)
          .attr("x", d => padX + chartW * d.ratio)
          .attr("y", h - 4)
          .attr("text-anchor", d => d.ratio < 0.1 ? "start" : (d.ratio > 0.9 ? "end" : "middle"))
          .text(d => d.label);
        labels.exit().remove();
      }

      window.setSpectrumAccent = function (hex) {
        applyAccent(hex);
        render(lastFrame);
      };

      window.updateSpectrum = function (frame) {
        if (!frame) return;
        lastFrame = frame;
        render(frame);
      };

      window.addEventListener("resize", function () { render(lastFrame); });
      render(lastFrame);
    })();
  </script>
</body>
</html>
