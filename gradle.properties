# Project-wide Gradle settings (Nigutu / Echo Music)
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
android.newDsl=false
android.useFullClasspathForDexingTransform=true
android.suppressUnsupportedCompileSdk=37,37.0

# Allow the google-services plugin to work even if google-services.json is absent
googleServices.missing.passthrough=true
