name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test Nigutu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK Platform, NDK & CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Run Unit Tests Across Modules
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          FLOW_NEURO_API_KEY: ${{ secrets.FLOW_NEURO_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 \
            :domain:test \
            :metadata:test \
            :dsp-core:test \
            :innertube:test \
            :canvas:test \
            :core:testDebugUnitTest \
            :lyrics:testDebugUnitTest \
            :playback:testGmsDebugUnitTest \
            :audio-dsp:testDebugUnitTest \
            :usbaudio:testDebugUnitTest \
            :lrclib:testDebugUnitTest \
            :kugou:testDebugUnitTest \
            :paxsenixlyrics:testDebugUnitTest \
            :shazamkit:testDebugUnitTest \
            :app:testUniversalGmsDebugUnitTest

      - name: Build Debug APKs
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          FLOW_NEURO_API_KEY: ${{ secrets.FLOW_NEURO_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleUniversalGmsDebug assembleUniversalFossDebug
          test -s app/build/outputs/apk/universalGms/debug/app-universalGms-debug.apk || \
            find app/build/outputs/apk -name "*.apk" -size +0c | grep -q .

      - name: Decode Release Keystore (when configured)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Build Release APK (when signing configured)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          FLOW_NEURO_API_KEY: ${{ secrets.FLOW_NEURO_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleUniversalGmsRelease

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nigutu-Test-Reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

      - name: Upload Universal APKs
        uses: actions/upload-artifact@v4
        with:
          name: Nigutu-Universal-APK
          path: app/build/outputs/apk/**/*.apk
